<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>미디어 지킴이 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 모눈종이 하늘 위의 구불구불 스테이지 길 → 스테이지마다 음표 친구 안내 + 큰 활동 카드 한 장 */
:root{
  --sky:#E2ECFF; --grid:#CFDDFA; --ink:#22305C; --ink-2:#5A6690; --paper:#FFFFFF; --line:#AFC5F2;
  --blue:#4C7BEA; --blue-d:#2E59BF; --blue-l:#EAF1FF;
  --u1:#FFC23D; --u1-d:#D99400; --u1-l:#FFF4D6;
  --u2:#FF8BA0; --u2-d:#DA5670; --u2-l:#FFE8ED;
  --u3:#3CC4A3; --u3-d:#1C977B; --u3-l:#DDF7EF;
  --u4:#9C7BF2; --u4-d:#6B4CC7; --u4-l:#F0EAFF;
  --u5:#FF9A4D; --u5-d:#D46A1C; --u5-l:#FFEEDF;
  --u6:#4AAEE6; --u6-d:#1F80B8; --u6-l:#E0F2FC;
  --good:#22A86D; --good-l:#E2F7EC; --bad:#EB5A5A; --bad-l:#FFE9E9; --lock:#C6CEDF;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding-block:18px 40px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}

/* ---------- 버튼 ---------- */
.btn{font-family:var(--f-display);font-size:1.25rem;border:0;border-radius:20px;padding:.65em 1.4em;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn:disabled{background:var(--lock);box-shadow:0 5px 0 #A9B3C8;cursor:default;opacity:.85}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.small{font-size:1.05rem;padding:.5em 1.1em;border-radius:16px}
.btn.ready{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.icon-btn{border:0;background:var(--paper);border-radius:16px;min-width:52px;height:52px;font-size:1.4rem;box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-family:var(--f-display)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- 지도 화면 ---------- */
.map-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border-radius:28px;padding:14px 20px;box-shadow:0 6px 0 var(--line)}
.map-head .mascot{width:72px;height:88px;flex:none}
.map-head .ttl{flex:1;min-width:200px}
.map-head h1{font-size:2rem;line-height:1.15;color:var(--blue-d)}
.map-head p{margin:2px 0 0;color:var(--ink-2);font-size:1rem}
.star-total{font-family:var(--f-display);font-size:1.3rem;background:var(--u1-l);border:3px solid var(--u1);border-radius:999px;padding:6px 16px;white-space:nowrap}
.map-body{position:relative;margin-top:22px}
#map-svg{position:absolute;inset:0;pointer-events:none;z-index:0;max-width:100%;overflow:hidden}
.unit-banner{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin:18px auto 6px;max-width:560px;background:var(--paper);border-radius:22px;padding:10px 18px;border:4px solid var(--uc);box-shadow:0 5px 0 var(--ucd)}
.unit-banner .no{flex:none;width:44px;height:44px;border-radius:50%;background:var(--uc);color:#fff;font-family:var(--f-display);font-size:1.5rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 var(--ucd)}
.unit-banner .nm{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.unit-banner .sub{font-size:.9rem;color:var(--ink-2)}
.u1{--uc:var(--u1);--ucd:var(--u1-d);--ucl:var(--u1-l)}
.u2{--uc:var(--u2);--ucd:var(--u2-d);--ucl:var(--u2-l)}
.u3{--uc:var(--u3);--ucd:var(--u3-d);--ucl:var(--u3-l)}
.u4{--uc:var(--u4);--ucd:var(--u4-d);--ucl:var(--u4-l)}
.u5{--uc:var(--u5);--ucd:var(--u5-d);--ucl:var(--u5-l)}
.u6{--uc:var(--u6);--ucd:var(--u6-d);--ucl:var(--u6-l)}
.node-row{position:relative;height:168px;z-index:1}
.node{position:absolute;top:8px;width:150px;margin-left:-75px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.node .disc{width:96px;height:96px;border-radius:50%;background:var(--paper);border:5px solid var(--uc);box-shadow:0 7px 0 var(--ucd);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s}
.node:active .disc{transform:translateY(4px);box-shadow:0 3px 0 var(--ucd)}
.node .disc .ic{font-size:2.3rem;line-height:1}
.node .disc .cd{font-family:var(--f-display);font-size:.95rem;color:var(--ink-2);margin-top:2px}
.node .lb{font-family:var(--f-display);font-size:1.02rem;line-height:1.25;text-align:center;background:var(--paper);border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 var(--line);max-width:150px}
.node .stars{font-size:1.05rem;letter-spacing:2px;color:var(--lock);height:1.3em}
.node .stars b{color:var(--u1);font-weight:400}
.node.done .disc{background:var(--ucl)}
.node.locked .disc{border-color:var(--lock);box-shadow:0 7px 0 #A9B3C8;background:#EEF1F7}
.node.locked .disc .ic{filter:grayscale(1);opacity:.45}
.node.locked .lb{color:#8A93AC}
.node.current .disc{animation:bob 1.4s ease-in-out infinite}
.node .here{position:absolute;top:-20px;font-family:var(--f-display);font-size:.9rem;background:var(--blue);color:#fff;padding:2px 10px;border-radius:999px;white-space:nowrap;z-index:2}
.node .here::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--blue)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.map-foot{display:flex;justify-content:center;margin-top:26px}
.lock-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--f-display);font-size:1.1rem;padding:12px 22px;border-radius:18px;z-index:50;max-width:calc(100% - 32px);text-align:center}

/* ---------- 선생님 메뉴 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(34,48,92,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:26px;padding:22px;max-width:440px;width:100%;box-shadow:0 8px 0 var(--line)}
.sheet h2{font-size:1.5rem;margin-bottom:6px}
.sheet .note{font-size:.95rem;color:var(--ink-2);margin:0 0 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px dashed var(--grid)}
.set-row .t{font-family:var(--f-display);font-size:1.1rem}
.set-row .d{font-size:.88rem;color:var(--ink-2)}
.tgl{width:64px;height:36px;border-radius:999px;border:0;background:var(--lock);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.tgl[aria-pressed="true"]{background:var(--good)}
.tgl[aria-pressed="true"]::after{left:32px}
.danger{background:var(--bad);box-shadow:0 5px 0 #B83B3B}

/* ---------- 스테이지 화면 ---------- */
.st-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.st-tag{flex:none;font-family:var(--f-display);font-size:1.1rem;background:var(--uc);color:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 var(--ucd)}
.st-tt{flex:1;min-width:180px}
.st-tt h2{font-size:1.6rem;line-height:1.2}
.st-tt .goal{font-size:.95rem;color:var(--ink-2)}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--line)}
.dots i.on{background:var(--uc);border-color:var(--ucd)}
.dots i.now{transform:scale(1.25);border-color:var(--ucd)}
.guide{display:flex;align-items:flex-end;gap:10px;margin-top:16px}
.guide .mascot{width:86px;height:104px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:14px 64px 14px 18px;font-family:var(--f-display);font-size:1.3rem;line-height:1.4;margin-bottom:14px}
.bubble::before{content:"";position:absolute;left:-16px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:21px;border:7px solid transparent;border-right:10px solid var(--paper);border-left:0}
.bubble .spk{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:14px;border:0;background:var(--blue-l);font-size:1.3rem}
.bubble .spk:active{background:var(--blue);}
.area{background:var(--paper);border-radius:30px;padding:22px;box-shadow:0 7px 0 var(--line);min-height:300px}
.st-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}

/* ---------- 공통 활동 위젯 ---------- */
.feedback{margin-top:14px;border-radius:18px;padding:12px 16px;font-size:1.1rem;line-height:1.45}
.feedback.good{background:var(--good-l);border:3px solid var(--good)}
.feedback.good b{font-family:var(--f-display);font-weight:400;color:var(--good)}
.feedback.bad{background:var(--bad-l);border:3px solid var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:var(--f-display);font-size:1.15rem;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:.35em 1em;box-shadow:0 3px 0 var(--line)}
.chip.sel{background:var(--uc);border-color:var(--ucd);color:#fff;box-shadow:0 3px 0 var(--ucd)}
.chip:active{transform:translateY(2px)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pop-in{animation:popin .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.counter{font-family:var(--f-display);font-size:1.1rem;color:var(--ink-2);text-align:center;margin-top:12px}
.counter b{color:var(--ucd);font-weight:400;font-size:1.3rem}
.lead{font-family:var(--f-display);font-size:1.2rem;margin:0 0 12px}

/* 퀴즈 */
.q-num{font-family:var(--f-display);font-size:.95rem;background:var(--ucl);color:var(--ucd);border-radius:999px;padding:2px 12px}
.q-head{min-height:6px;margin-bottom:10px}
.q-art{display:flex;justify-content:center;margin-bottom:12px}
.q-text{font-family:var(--f-display);font-size:1.4rem;line-height:1.4;text-align:center;margin-bottom:16px}
.q-text .ini{display:inline-block;background:var(--u1-l);border:3px dashed var(--u1-d);border-radius:12px;padding:0 10px;margin:0 2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{border:4px solid var(--line);background:var(--paper);border-radius:20px;padding:14px 12px;font-family:var(--f-display);font-size:1.25rem;line-height:1.3;box-shadow:0 5px 0 var(--line);min-height:64px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--good-l);box-shadow:0 5px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);box-shadow:0 5px 0 var(--bad);opacity:.7}
.opt.dim{opacity:.4}
.opt .big{display:block;font-size:2.6rem;line-height:1.1;margin-bottom:4px}
.q-next{display:flex;justify-content:center;margin-top:14px}

/* 분류 */
.sort-slot{display:flex;flex-direction:column;align-items:center;min-height:170px;justify-content:center}
.sort-card{width:160px;height:150px;border-radius:26px;background:var(--ucl);border:4px solid var(--uc);box-shadow:0 6px 0 var(--ucd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sort-card .e{font-size:3.6rem;line-height:1}
.sort-card .l{font-family:var(--f-display);font-size:1.3rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.bin{border:4px dashed var(--line);background:var(--blue-l);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:130px;transition:background .2s}
.bin .be{font-size:2rem;line-height:1}
.bin .bl{font-family:var(--f-display);font-size:1.2rem}
.bin .bi{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:1.5rem;min-height:1.8rem}
.bin.flash{background:var(--good-l);border-color:var(--good)}
.bin.lock .bl::after{content:" 🔒"}

/* 문장 채우기 */
.fill{display:flex;flex-direction:column;gap:18px}
.fill-row{background:var(--blue-l);border-radius:20px;padding:14px 16px}
.fill-sent{font-family:var(--f-display);font-size:1.35rem;margin-bottom:10px}
.blank{display:inline-block;min-width:3.4em;text-align:center;border-bottom:4px solid var(--ink-2);padding:0 6px;color:var(--ink-2)}
.blank.on{color:var(--ucd);border-color:var(--ucd)}

/* 장면 찾기 */
.room{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(#FFF6E3 0 62%,#E9C99A 62% 100%);border:4px solid #E3C08E;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px}
.thing{border:0;background:transparent;border-radius:20px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;position:relative}
.thing .e{font-size:2.8rem;line-height:1.15;transition:transform .15s}
.thing .n{font-size:.95rem;font-family:var(--f-display);opacity:0;transition:opacity .2s}
.thing.found{background:rgba(255,255,255,.75)}
.thing.found::after{content:"";position:absolute;inset:2px;border:4px solid var(--bad);border-radius:50%;animation:popin .3s}
.thing.found .n{opacity:1}
.thing.nope .n{opacity:1;color:var(--ink-2)}

/* 하루 미디어 지도 */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--u1-l);border:3px dashed var(--u1-d);border-radius:20px;padding:10px;margin-bottom:14px}
.stk{width:56px;height:56px;border-radius:50%;border:3px solid transparent;background:var(--paper);font-size:1.9rem;box-shadow:0 3px 0 var(--line)}
.stk.sel{border-color:var(--blue);transform:scale(1.12);box-shadow:0 3px 0 var(--blue-d)}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.place{border:3px solid var(--line);background:#F7FBF3;border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:76px;text-align:left}
.place .pe{font-size:2rem;flex:none}
.place .pl{font-family:var(--f-display);font-size:1.1rem;flex:1;min-width:0}
.place .ps{display:flex;gap:4px}
.place .ps span{width:36px;height:36px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--paper)}
.place .ps span.on{border:2px solid var(--blue)}

/* 막대 */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bar-row .bn{font-family:var(--f-display);font-size:1.3rem;width:90px;flex:none}
.cells{display:flex;gap:4px;flex:1;min-width:260px}
.cell{flex:1;height:52px;border:3px solid var(--ink);border-radius:8px;background:var(--paper)}
.cell.g.on{background:#9BDB8E}.cell.o.on{background:#FFC97A}.cell.r.on{background:#FF9C9C}
.bar-lbl{width:100%;padding-left:102px;font-family:var(--f-display);color:var(--ink-2)}

/* 그림 */
.pic{width:100%;max-width:360px;border-radius:18px;border:4px solid var(--ink);background:var(--paper);display:block}
.draw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.opt-grp{margin-bottom:14px}
.opt-grp .t{font-family:var(--f-display);font-size:1.1rem;margin-bottom:6px}
.listen{display:flex;flex-direction:column;gap:6px;background:var(--u1-l);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-family:var(--f-display);font-size:1.15rem}
.pics4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.pics4 figure{margin:0;text-align:center;font-family:var(--f-display)}
.pics4 .pic{max-width:none}
.result{margin-top:16px;display:flex;justify-content:center}
.letter{background:#FFFBEA;border:3px solid var(--u1);border-radius:6px 22px 6px 22px;padding:20px 26px;font-family:var(--f-display);font-size:1.6rem;max-width:340px;box-shadow:0 5px 0 var(--u1-d);transform:rotate(-1.5deg)}
.say-big{background:var(--paper);border:4px solid var(--ink);border-radius:40px;padding:16px 30px;font-family:var(--f-display);font-size:2rem}
.drawing{font-size:4rem;letter-spacing:6px;background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:12px 24px;text-align:center}
.drawing small{display:block;font-size:1.3rem;font-family:var(--f-display);letter-spacing:0}
.video{position:relative;width:280px;max-width:100%;background:#2B2F3D;border-radius:26px;padding:14px}
.video .scr{background:#FFF1F4;border-radius:14px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.video .scr .mascot{width:70px;height:84px}
.video .rec{position:absolute;top:22px;left:24px;color:var(--bad);font-family:var(--f-display);font-size:1rem}
.video .cap{font-family:var(--f-display);font-size:1.3rem}

/* 태블릿 */
.tab-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.tablet{position:relative;background:#2B2F3D;border-radius:30px;padding:16px;aspect-ratio:4/3;max-width:100%}
.tablet .pwr{position:absolute;top:-10px;right:46px;width:56px;height:14px;border-radius:6px 6px 0 0;background:#55607A;border:0;padding:0}
.tablet .pwr.hint{background:var(--u1);animation:nudge 1s infinite}
.screen{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#0E1120}
.scr-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-family:var(--f-display);text-align:center;padding:10px}
.apps{position:absolute;inset:0;background:linear-gradient(160deg,#BFD6FF,#F8D9F1);display:grid;grid-template-columns:repeat(3,1fr);align-content:center;gap:12px;padding:16px}
.app{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-size:.95rem;color:var(--ink)}
.app span{width:58px;height:58px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.cam{position:absolute;inset:0;background:#20242F;display:flex;align-items:center;justify-content:center}
.qr{width:46%;max-width:170px;aspect-ratio:1;background:#fff;padding:8px;border-radius:8px;border:0;position:relative}
.qr svg{width:100%;height:100%;display:block}
.scanline{position:absolute;left:4px;right:4px;height:4px;background:#5BF08A;top:6px;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{50%{top:calc(100% - 10px)}}
.cam .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.6);border-radius:18px;pointer-events:none}
.maps{position:absolute;inset:0;background:#EEF3E6;overflow:hidden}
.mworld{position:absolute;inset:0;transition:transform .5s ease;transform-origin:62% 58%}
.road{position:absolute;background:#fff;border:1px solid #D9DFD0}
.mi{position:absolute;font-size:1.1rem;transform:translate(-50%,-50%)}
.school{position:absolute;left:62%;top:58%;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);color:var(--ink)}
.school .se{font-size:1.2rem;transition:font-size .4s}
.school .sl{font-size:.45rem;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.searchbar{position:absolute;top:10px;left:10px;right:30%;height:40px;border-radius:12px;background:#fff;border:3px solid #23C562;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:.95rem;color:#8A93AC;z-index:3}
.searchbar.hint{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(35,197,98,.35)}}
.sugg{position:absolute;top:56px;left:10px;right:30%;background:#fff;border-radius:12px;border:0;box-shadow:0 4px 10px rgba(0,0,0,.12);padding:8px 12px;text-align:left;z-index:3;font-family:var(--f-display)}
.sugg small{display:block;font-family:var(--f-body);color:#8A93AC;font-size:.8rem}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:48px;height:48px;border-radius:12px;border:0;background:#fff;font-size:1.6rem;font-family:var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.zoom button.hint{background:var(--u1)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:1.05rem;background:var(--blue-l);border-radius:14px;padding:8px 12px;color:var(--ink-2)}
.checklist li .ck{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#fff}
.checklist li.now{background:var(--u1-l);color:var(--ink);outline:3px solid var(--u1)}
.checklist li.ok{color:var(--ink)}
.checklist li.ok .ck{background:var(--good);border-color:var(--good)}

/* 칭찬 기차 */
.situ{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--ucl);border-radius:22px;padding:16px;margin-bottom:14px}
.situ .se{font-size:3.4rem;line-height:1.1;position:relative}
.situ .se .put{position:absolute;right:-46px;bottom:-6px;font-size:2.4rem;background:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:3px dashed var(--line)}
.situ .st{font-family:var(--f-display);font-size:1.35rem}
.emo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.emo{border:3px solid var(--line);background:#fff;border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:.85rem;box-shadow:0 3px 0 var(--line)}
.emo span{font-size:1.9rem;line-height:1.2}
.compare2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.cmp{border-radius:20px;padding:16px;text-align:center;font-family:var(--f-display);font-size:1.15rem}
.cmp .big{font-size:3rem;line-height:1.2}
.phone{background:#2B2F3D;border-radius:26px;padding:10px;max-width:250px;margin:0 auto}
.phone .ps{background:#F4F6FB;border-radius:18px;min-height:150px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{align-self:flex-start;background:#fff;border:2px solid #9AA5BF;border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:1rem;max-width:90%;text-align:left}
.msg.me{align-self:flex-end;background:#FFF1A8;border-color:#E3C440;border-radius:16px 16px 4px 16px}
.msg .who{display:block;font-size:.75rem;color:var(--ink-2)}
.train{display:flex;align-items:flex-end;gap:0;overflow-x:auto;padding:16px 4px 6px;min-height:150px}
.engine{flex:none;font-size:4.6rem;line-height:1;transform:scaleX(-1)}
.car{flex:none;width:120px;height:92px;margin-left:6px;background:var(--u2-l);border:4px solid var(--u2);border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1.25rem;animation:popin .35s}
.car::before,.car::after{content:"";position:absolute;bottom:-14px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
.car::before{left:14px}.car::after{right:14px}
.car .ce{font-size:1.6rem;line-height:1}
.car.empty{background:transparent;border-style:dashed;color:var(--ink-2);font-size:1rem}
.track{height:6px;background:var(--ink-2);border-radius:3px;margin:12px 0 18px}
.train.go{animation:chug .5s ease-in-out 3}
@keyframes chug{50%{transform:translateY(-4px)}}

/* 채팅 순서 */
.chat-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.chatwin{transition:opacity .4s,transform .4s}
.chatwin.closed{opacity:.15;transform:scale(.9)}
.acts{display:flex;flex-direction:column;gap:10px}
.act{border:4px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;font-family:var(--f-display);font-size:1.2rem;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;gap:10px;align-items:center}
.act .an{width:32px;height:32px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center;flex:none;font-size:1rem}
.act.ok{border-color:var(--good);background:var(--good-l)}
.act.ok .an{background:var(--good);color:#fff}
.act:disabled{cursor:default}

/* O/X 카드 */
.ox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.ox{border:4px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff}
.ox .sc{width:100%;height:110px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:3rem;gap:4px}
.ox .sc.day{background:#FFF4DC}.ox .sc.night{background:#2D3A6B}
.ox .ol{font-family:var(--f-display);font-size:1.15rem;text-align:center}
.ox .ob{display:flex;gap:10px}
.ox .ob button{width:62px;height:56px;border-radius:16px;border:3px solid var(--line);background:#fff;font-family:var(--f-display);font-size:1.7rem;box-shadow:0 3px 0 var(--line)}
.ox.done.o{border-color:var(--good);background:var(--good-l)}
.ox.done.x{border-color:var(--good);background:var(--good-l)}
.ox.done .ob button{opacity:.35}
.ox.done .ob button.pick{opacity:1;border-color:var(--good);color:var(--good)}

.promise{border:5px solid var(--u2);border-radius:26px;padding:18px;background:#FFFAFB;margin-top:16px}
.promise h3{font-size:1.5rem;text-align:center;color:var(--u2-d);margin-bottom:10px}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pr-box{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.pr-box .t{font-family:var(--f-display);font-size:1.05rem;color:var(--ink-2)}
.pr-box .v{font-family:var(--f-display);font-size:1.35rem;margin-top:4px}
.sign{display:flex;justify-content:flex-end;gap:20px;margin-top:12px;font-family:var(--f-display);flex-wrap:wrap}
.sign span{border-bottom:2px solid var(--ink-2);min-width:90px;display:inline-block}

/* 광고 */
.ad{position:relative;height:280px;border-radius:24px;overflow:hidden;background:#E9ECF2;border:4px solid var(--ink);transition:background .5s}
.ad.fx-color{background:repeating-conic-gradient(from 0deg at 50% 70%,#FFD93B 0 15deg,#FF9F43 15deg 30deg)}
.ad .bag{position:absolute;left:50%;bottom:34px;width:90px;height:116px;margin-left:-45px;border-radius:14px 14px 8px 8px;background:#D6A24B;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--f-display);font-size:1rem;color:#fff;transition:transform .5s;transform:scale(.8);transform-origin:bottom center}
.ad .bag b{font-weight:400;font-size:1.6rem}
.ad.fx-color .bag{background:#F0541E;transform:scale(1.3)}
.ad .chipsfx{position:absolute;left:50%;bottom:24px;margin-left:-110px;width:220px;text-align:center;font-size:2rem;letter-spacing:-6px;opacity:0;transition:opacity .4s}
.ad.fx-color .chipsfx{opacity:1}
.ad .face{position:absolute;left:8%;bottom:36px;font-size:3.2rem;opacity:0;transition:opacity .4s}
.ad .face small{display:block;font-family:var(--f-display);font-size:.95rem;background:#fff;border-radius:10px;padding:2px 8px;border:2px solid var(--ink)}
.ad.fx-face .face{opacity:1}
.ad .words{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:1.6rem;color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .4s;padding:0 12px}
.ad.fx-words .words{opacity:1}
.ad .notes{position:absolute;right:8%;top:30%;font-size:2rem;opacity:0;transition:opacity .4s}
.ad.fx-music .notes{opacity:1;animation:float 1.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
.ad .real{position:absolute;top:16px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}
.fx-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.fx-btn{border:4px solid var(--u3);background:var(--u3-l);border-radius:18px;padding:10px;font-family:var(--f-display);font-size:1.1rem;box-shadow:0 4px 0 var(--u3-d)}
.fx-btn.off{background:#EEF1F7;border-color:var(--lock);box-shadow:0 4px 0 #A9B3C8;color:#8A93AC;text-decoration:line-through}
.toyad{position:relative;height:260px;border-radius:24px;background:linear-gradient(135deg,#4C7BEA,#9B6CF0);border:4px solid var(--ink);overflow:hidden;color:#fff}
.toyad .car-e{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scaleX(-1);font-size:5.5rem}
.toyad .lines{position:absolute;left:12%;top:44%;font-size:2rem;letter-spacing:-4px;opacity:.8}
.toyad .hd{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:1.6rem;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.fine{position:absolute;border:2px dashed rgba(255,255,255,.8);background:rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:.62rem;padding:4px 8px;max-width:44%;font-family:var(--f-body);text-align:left}
.fine.open{background:#fff;color:var(--ink);font-family:var(--f-display);font-size:1rem;border:3px solid var(--u1);z-index:2;animation:popin .3s}

/* 추천 피드 */
.feed-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vid{border:0;border-radius:16px;padding:0;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--line);text-align:left;font-family:var(--f-display);position:relative}
.vid .th{height:74px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.vid .th::after{content:"▶";position:absolute;right:6px;bottom:4px;font-size:.8rem;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px}
.vid .vt{display:block;font-size:.92rem;padding:5px 8px 7px;line-height:1.2}
.vid.flip{animation:popin .35s}
.vid.watching .th::before{content:"보는 중…";position:absolute;inset:0;background:rgba(34,48,92,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;z-index:1}
.c-animal .th{background:#FFE3C2}.c-soccer .th{background:#CDEFD4}.c-dino .th{background:#DCD3FF}.c-cook .th{background:#FFD6E2}.c-car .th{background:#CFE4FF}
.memo{background:var(--u3-l);border:3px solid var(--u3);border-radius:20px;padding:14px}
.memo h3{font-size:1.15rem;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-family:var(--f-display);font-size:1rem}
.mrow .mn{width:62px;flex:none}
.mrow .mb{height:16px;border-radius:8px;background:var(--u3);transition:width .4s;min-width:4px}
.stopbtn{margin-top:12px;width:100%}
.twofeed{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.twofeed .tf{border-radius:20px;background:var(--blue-l);padding:12px}
.twofeed .tf .who{font-family:var(--f-display);font-size:1.1rem;margin-bottom:8px;text-align:center}
.mini-feed{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini-feed span{height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}

/* 클리어 */
.clear-bg{position:fixed;inset:0;background:rgba(34,48,92,.55);z-index:45;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.clear-card{background:var(--paper);border-radius:32px;padding:26px 22px;max-width:460px;width:100%;text-align:center;border:6px solid var(--uc);box-shadow:0 9px 0 var(--ucd);animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.clear-card .mascot{width:96px;height:116px}
.clear-card h2{font-size:2rem;color:var(--ucd)}
.big-stars{font-size:3rem;letter-spacing:6px;margin:6px 0;color:var(--lock)}
.big-stars b{color:var(--u1);font-weight:400;display:inline-block;animation:popin .5s both}
.big-stars b:nth-child(2){animation-delay:.2s}.big-stars b:nth-child(3){animation-delay:.4s}
.clear-card .g{background:var(--ucl);border-radius:16px;padding:10px 14px;font-size:1.05rem;margin:10px 0 16px}
.clear-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- 4~6단원 ---------- */
.comic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.panel{position:relative;aspect-ratio:4/3;border:4px solid var(--ink);border-radius:14px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;max-width:100%}
.panel.act{outline:5px solid var(--uc);outline-offset:2px}
.panel .pl{position:absolute;top:6px;left:8px;font-family:var(--f-display);font-size:.85rem;color:var(--ink-2)}
.panel .ps{font-size:2.8rem;line-height:1}
.panel .ps.empty{font-size:1.6rem;color:var(--line);font-family:var(--f-display)}
.panel .pb{position:absolute;top:22px;right:8px;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 2px;padding:2px 8px;font-family:var(--f-display);font-size:.95rem}
.news{border:5px solid var(--ink);border-radius:20px;background:#fff;padding:14px;margin-top:12px}
.news .nh{font-family:var(--f-display);font-size:1.5rem;border-bottom:4px double var(--ink);padding-bottom:6px;margin-bottom:10px;text-align:center}
.news .nf{text-align:right;font-family:var(--f-display);color:var(--ink-2);margin-top:8px}
.news .comic{margin:0}
.news .panel{cursor:default}
.camera{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.viewer{position:relative;border-radius:22px;overflow:hidden;border:4px solid var(--ink);aspect-ratio:4/3;background:#FFF4DC;display:flex;align-items:center;justify-content:center;max-width:100%}
.viewer .subj{font-size:4rem;line-height:1}
.viewer .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.viewer .flash.go{animation:flash .45s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shot{border:3px solid var(--line);border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-display);font-size:.95rem}
.shot.sel{border-color:var(--uc);background:var(--ucl)}
.ph{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.ph.close{background:#FFF4DC}.ph.close span{font-size:6rem;line-height:1}
.ph.far{background:linear-gradient(#FFF4DC 0 70%,#D9B38A 70%)}.ph.far span{font-size:1.1rem}
.ph.top{background:#C9965E}.ph.top span{font-size:2.6rem;transform:scaleY(.8)}
.ph.low{background:linear-gradient(#BFE0FF,#E8F4FF)}.ph.low span{font-size:3.4rem;transform:translateY(12%) rotate(-8deg)}
.frame-card{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:14px}
.polaroid{background:#fff;padding:10px 10px 30px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line);width:220px;max-width:100%;transform:rotate(-2deg);position:relative}
.polaroid .cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--f-display)}
.poster{border-radius:22px;border:5px solid var(--ink);padding:18px;text-align:center;background:var(--pbg,#FFF4D6);margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto}
.poster .pe{font-size:4rem;line-height:1.1}
.poster .pt{font-family:var(--f-display);font-size:1.6rem;line-height:1.3}
.poster .pg{font-size:1.1rem;margin-top:6px}
.poster .pk{font-size:2rem;letter-spacing:4px;margin-top:6px;min-height:2.4rem}
.poster .pw{font-family:var(--f-display);font-size:1rem;color:var(--ink-2);margin-bottom:6px}
.speaker-scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-bottom:14px}
.speaker{width:90px;height:130px;border-radius:40px 40px 20px 20px;background:linear-gradient(#5A6690,#2B2F3D);position:relative;border:4px solid var(--ink)}
.speaker::before{content:"";position:absolute;top:10px;left:16px;right:16px;height:8px;border-radius:4px;background:#3CC4A3;opacity:.25}
.speaker.talk::before{opacity:1;animation:glowbar .5s infinite alternate}
@keyframes glowbar{to{background:#9DF0D9}}
.speaker::after{content:"AI";position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-family:var(--f-display)}
.ai-ans{background:var(--u5-l);border:3px solid var(--u5);border-radius:18px;padding:12px 16px;font-family:var(--f-display);font-size:1.15rem;min-height:60px}
.opt.long{font-family:var(--f-body);font-size:1rem;text-align:left;line-height:1.5}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chk{border:4px solid var(--line);border-radius:20px;background:#fff;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:1.1rem;text-align:center;box-shadow:0 4px 0 var(--line)}
.chk .ce{font-size:2.4rem;line-height:1}
.chk .box{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.chk.on{border-color:var(--uc);background:var(--ucl)}
.chk.on .box{background:var(--ucd);border-color:var(--ucd)}
.mcard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.mface{border:5px double #8C7A63;border-radius:18px;background:#FFFBF2;padding:14px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mface .k{font-family:var(--f-display);background:var(--ucl);border-radius:999px;padding:2px 12px;font-size:.95rem}
.mface .e{font-size:3.4rem;line-height:1.1}
.mface .t{font-family:var(--f-display);font-size:1.2rem}

.t-tabs .tab{font-size:1.1rem;padding:8px 16px}

/* ---------- 교사 화면 ---------- */
.t-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border-radius:26px;padding:16px 20px;box-shadow:0 6px 0 var(--line)}
.t-head .ttl{flex:1;min-width:240px}
.t-head h1{font-size:1.8rem;color:var(--ink)}

.t-panel label{font-family:var(--f-display);font-size:1.05rem;display:block;margin:10px 0 6px}
.preset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.preset{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 10px;text-align:left;font-family:var(--f-display);font-size:1.05rem}

.preset.sel{border-color:var(--blue);background:var(--blue-l)}
.v-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.tip{background:var(--u1-l);border-radius:14px;padding:10px 12px;font-size:.9rem;margin-top:14px;line-height:1.5}
.t-unit{margin-top:26px}
.t-unit-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.t-unit-h .no{width:40px;height:40px;border-radius:50%;background:var(--uc);color:#fff;font-family:var(--f-display);font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.t-unit-h h2{font-size:1.4rem}
.t-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.t-card{background:var(--paper);border-radius:20px;border-top:8px solid var(--uc);padding:14px 16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.t-card .tc-h{display:flex;gap:8px;align-items:baseline}

.t-card li::before{content:counter(a);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ucl);color:var(--ucd);font-family:var(--f-display);font-size:.85rem;display:flex;align-items:center;justify-content:center}
.t-card li span{flex:1;min-width:0}
.pv{flex:none;font-family:var(--f-display);font-size:.88rem;border:2px solid var(--ucd);color:var(--ucd);background:var(--ucl);border-radius:999px;padding:3px 10px}
.tc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:.9rem;color:var(--ink-2)}
.tc-f b{color:var(--u1);font-weight:400}
.pv-tag{flex-basis:100%;font-family:var(--f-display);font-size:.95rem;background:var(--ink);color:#fff;border-radius:12px;padding:6px 12px;text-align:center}
.gate input{width:100%;font-family:var(--f-display);font-size:1.8rem;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--line);margin:10px 0 4px;color:var(--ink);background:#fff}
.gate .q{font-family:var(--f-display);font-size:1.6rem;text-align:center;margin-top:8px}

@media (max-width:640px){
  .t-grid{grid-template-columns:minmax(0,1fr)}

  *,*::before,*::after{animation:none!important;transition:none!important}

    <div data-tab="units"><div class="std-legend" id="t-std"></div><div id="t-units"></div></div>

<script>
/* ================= 기본 도구 ================= */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(tag==='button')e.type='button';return e;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shake(e){if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}
function hasJong(w){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
const josa=(w,a,b)=>hasJong(w)?a:b;

const SAVE_KEY='media-guardian-v1';
const DEF=()=>({cleared:{},unlockAll:false,autoRead:false,map:null,map2:null,day:null,day2:null,promise:null,voice:'',preset:'warm',school:'',train:[],cloud:null,share:null,sv:2,ver:29,roster:[],students:{},me:null,showNames:true,last:null,klass:null,outbox:[],remote:null,works:[],rubric:null,tgrade:{}});
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.cleared){const o=Object.assign(DEF(),s);if(!s.sv){o.autoRead=false;o.sv=2;}if(o.ver!==29){o.cleared={};o.share=null;o.map=null;o.day=null;o.day2=null;o.ver=29;}if(!Array.isArray(o.roster))o.roster=[];if(!o.students)o.students={};if(o.me&&!o.roster.some(r=>r.id===o.me))o.me=null;return o;}}catch(e){}return DEF();}
let P=load();
function save(){if(typeof syncOut==='function')syncOut();const W=o=>localStorage.setItem(SAVE_KEY,JSON.stringify(o));
  try{W(P);return;}catch(e){}
  try{const q=JSON.parse(JSON.stringify(Object.assign({},P,{share:null})));Object.values(q.students||{}).forEach(x=>{if(x)x.share=null;});W(q);return;}catch(e){}
  for(let n=0;n<60;n++){const all=[];const pools=[];if(!P.me&&Array.isArray(P.works))pools.push(P.works);Object.values(P.students||{}).forEach(x=>{if(x&&Array.isArray(x.works))pools.push(x.works);});
    pools.forEach(a=>a.forEach((w,i)=>all.push([w.at||0,a,i])));if(!all.length)break;all.sort((x,y)=>x[0]-y[0]);all[0][1].splice(all[0][2],1);
    try{W(P);if(typeof toast==='function')toast('저장 공간이 부족해서 오래된 작품을 정리했어요.');return;}catch(e){}}}
const PVSHARE={};function sharedData(st,pv){if(!st.share)return {};if(pv)return PVSHARE[st.share]||(PVSHARE[st.share]={});if(!P.share)P.share={};return P.share[st.share]||(P.share[st.share]={});}

let AC=null;
function sfx(t){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={good:[[660,0],[880,.09]],bad:[[300,0],[220,.13]],pop:[[600,0]],win:[[523,0],[659,.13],[784,.26],[1047,.4]],jingle:[[784,0],[880,.15],[988,.3],[784,.45],[1175,.6],[988,.8],[1047,1]]}[t]||[];
  seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const s=AC.currentTime+d;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.25);});}catch(e){}}

const PRESETS={warm:{n:'다정하게',d:'조금 느리고 부드럽게',rate:.9,pitch:1.12},slow:{n:'천천히 또박또박',d:'1학년 초반에 추천',rate:.78,pitch:1.05},bright:{n:'밝고 신나게',d:'높고 경쾌하게',rate:1,pitch:1.3},plain:{n:'기본',d:'기기 기본 설정',rate:1,pitch:1}};
function koVoices(){try{return (speechSynthesis.getVoices()||[]).filter(v=>/^ko/i.test(v.lang));}catch(e){return [];}}
function rankVoice(v){const n=v.name||'';if(/Natural|Neural|Online/i.test(n))return 0;if(/Premium|Enhanced|향상|고품질/i.test(n))return 1;if(/Google/i.test(n))return 2;if(/Yuna|유나|SunHi|선희|Heami|Sora/i.test(n))return 3;return 5;}
function bestVoice(){const vs=koVoices();if(!vs.length)return null;if(P.voice){const f=vs.find(v=>v.name===P.voice);if(f)return f;}return vs.slice().sort((a,b)=>rankVoice(a)-rankVoice(b))[0];}
function speak(t){try{const s=window.speechSynthesis;if(!s||!t)return;s.cancel();
  const txt=String(t).replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/[ㄱ-ㅎ]+/g,' 빈칸 ').replace(/[()]/g,' ');
  const u=new SpeechSynthesisUtterance(txt);u.lang='ko-KR';const pr=PRESETS[P.preset]||PRESETS.warm;u.rate=pr.rate;u.pitch=pr.pitch;
  const v=bestVoice();if(v)u.voice=v;s.speak(u);}catch(e){}}
function autoSpeak(t){if(P.autoRead)speak(t);}

/* 음표 친구 */
function mascot(prop){
  const props={
    glass:'<g transform="translate(6,96)"><circle cx="12" cy="12" r="11" fill="#DDF2FF" stroke="#4A5168" stroke-width="3"/><rect x="18" y="20" width="6" height="16" rx="3" transform="rotate(-40 21 28)" fill="#8A6A45"/></g>',
    star:'<path d="M14 92 l5 10 11 1 -8 7 3 11 -11 -6 -10 6 3 -11 -8 -7 11 -1z" fill="#FFC23D" stroke="#4A5168" stroke-width="2.5" stroke-linejoin="round"/>',
    heart:'<path d="M60 124 c-14-10-20-16-20-24 a9 9 0 0 1 20-4 a9 9 0 0 1 20 4 c0 8-6 14-20 24z" fill="#FF6B86" stroke="#4A5168" stroke-width="2.5"/>',
    shield:'<path d="M8 96 l14-6 14 6 v10 c0 10-6 16-14 20 c-8-4-14-10-14-20z" fill="#5B8CF0" stroke="#4A5168" stroke-width="2.5"/>'
  };
  return `<svg class="mascot" viewBox="0 0 130 156" aria-hidden="true">
  <rect x="44" y="118" width="8" height="18" rx="4" fill="#E2E6EF" stroke="#4A5168" stroke-width="3"/>
  <rect x="70" y="118" width="8" height="18" rx="4" fill="#E2E6EF" stroke="#4A5168" stroke-width="3"/>
  <ellipse cx="45" cy="141" rx="13" ry="7.5" fill="#FFC23D" stroke="#4A5168" stroke-width="3"/>
  <ellipse cx="78" cy="141" rx="13" ry="7.5" fill="#FFC23D" stroke="#4A5168" stroke-width="3"/>
  <path d="M96 20 C124 16 132 40 118 56 C114 42 106 36 98 38 Z" fill="#E9ECF3" stroke="#4A5168" stroke-width="3" stroke-linejoin="round"/>
  <rect x="90" y="16" width="9" height="78" rx="4.5" fill="#E9ECF3" stroke="#4A5168" stroke-width="3"/>
  <path d="M25 98 q-10 4 -8 14" fill="none" stroke="#4A5168" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M97 98 q10 4 8 14" fill="none" stroke="#4A5168" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="96" r="37" fill="url(#mg)" stroke="#4A5168" stroke-width="3"/>
  <ellipse cx="47" cy="93" rx="5" ry="7" fill="#2A2F45"/><circle cx="49" cy="90" r="2" fill="#fff"/>
  <ellipse cx="73" cy="93" rx="5" ry="7" fill="#2A2F45"/><circle cx="75" cy="90" r="2" fill="#fff"/>
  <ellipse cx="37" cy="104" rx="6" ry="4" fill="#FFB4B4"/><ellipse cx="83" cy="104" rx="6" ry="4" fill="#FFB4B4"/>
  <path d="M52 106 Q60 117 68 106 Z" fill="#E2546B" stroke="#2A2F45" stroke-width="2" stroke-linejoin="round"/>
  ${props[prop]||''}</svg>`;
}

/* ================= 공통 활동 위젯 ================= */
function chips(words,onPick,cls){const w=el('div','chips');words.forEach(x=>{const b=el('button',cls||'chip',x);b.onclick=()=>onPick(x,b,w);w.append(b);});return w;}
function selectIn(wrap,b){[...wrap.children].forEach(x=>x.classList.toggle('sel',x===b));}

function quiz(area,ctx,items,opt={}){
  const box=el('div','quiz');area.append(box);let i=0;
  const show=()=>{
    const it=items[i];box.innerHTML='';
    box.append(el('div','q-head',items.length>1?`<span class="q-num">${i+1} / ${items.length}</span>`:''));
    if(it.art)box.append(el('div','q-art',it.art));
    const q=el('div','q-text',it.q);box.append(q);
    const ob=el('div','opts');box.append(ob);
    const fb=el('div','feedback');fb.hidden=true;box.append(fb);
    let locked=false;
    let wr=0;shuffle(it.opts.map((o,k)=>[o,k])).forEach(([o,k])=>{const b=el('button','opt'+(it.cls?' '+it.cls:''),o);
      b.onclick=()=>{if(locked||b.disabled)return;const ok=Array.isArray(it.ans)?it.ans.includes(k):k===it.ans;
        if(ok){locked=true;b.classList.add('right');sfx('good');[...ob.children].forEach(x=>{if(x!==b)x.classList.add('dim');});
          fb.className='feedback good';fb.innerHTML='<b>딩동댕!</b> '+(it.why||'');fb.hidden=false;autoSpeak('딩동댕! '+(it.why||''));
          if(i<items.length-1){const nx=el('div','q-next');const nb=el('button','btn small','다음 문제 ▶');nb.onclick=()=>{i++;show();};nx.append(nb);box.append(nx);}
          else{ctx.done();if(opt.onEnd)opt.onEnd(box);}
        }else{b.classList.add('wrong');b.disabled=true;shake(b);sfx('bad');ctx.miss();
          fb.className='feedback bad';fb.textContent=(it.hint&&it.hint[k])||it.hintAll||'다시 생각해 볼까요?';fb.hidden=false;wr++;if(wr>=2&&[...ob.children].filter(x=>!x.disabled).length>1){speak(fb.textContent);thinkPause(ob,fb);}else autoSpeak(fb.textContent);}
      };ob.append(b);});
  };show();
}

function sortGame(area,ctx,cards,bins){
  const wrap=el('div','sort');area.append(wrap);
  const slot=el('div','sort-slot');const fb=el('div','feedback');fb.hidden=true;const row=el('div','bins');
  wrap.append(slot,fb,row);const order=shuffle(cards.slice());let i=0,wrongN=0;
  bins.forEach(b=>{const be=el('button','bin'+(b.lock?' lock':''),`<span class="be">${b.e}</span><span class="bl">${b.label}</span><span class="bi"></span>`);

function memoryGame(a,c,pairs){const cards=shuffle(pairs.flatMap((p,i)=>[{id:i,html:`<span class="mc-e">${p[1]}</span><b>${p[0]}</b>`,say:p[0]},{id:i,html:`<span class="mc-m">${p[2]}</span>`,say:p[2]}]));
  const grid=el('div','mem-grid');let open=[],lock=false,matched=0,tries=0;const cnt=el('div','counter');const upd=()=>cnt.innerHTML=`찾은 짝 <b>${matched}</b> / ${pairs.length} · 뒤집은 횟수 ${tries}번`;upd();
  cards.forEach(cd=>{const b=el('button','mem',`<span class="mem-in"><span class="mem-back">?</span><span class="mem-front">${cd.html}</span></span>`);b.setAttribute('aria-label','뒤집힌 카드');
    b.onclick=()=>{if(lock||b.classList.contains('open'))return;b.classList.add('open');sfx('pop');autoSpeak(cd.say);open.push([b,cd]);
      if(open.length===2){tries++;lock=true;const [[b1,c1],[b2,c2]]=open;
        if(c1.id===c2.id){setTimeout(()=>{b1.classList.add('got');b2.classList.add('got');sfx('good');matched++;upd();open=[];lock=false;const p=pairs[c1.id];c.say(`딩동댕! ${p[0]}${josa(p[0],'은','는')} ${p[2]}${josa(p[2],'이에요','예요')}.`);if(matched===pairs.length){c.say('모든 짝을 찾았어요! 배운 낱말을 잘 기억하고 있어요.');c.done();}},350);}
        else{c.miss();setTimeout(()=>{b1.classList.remove('open');b2.classList.remove('open');open=[];lock=false;},1000);}
        upd();}};grid.append(b);});

function shrinkImage(file,mw,mh,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,mw/im.width,mh/im.height);const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82));};im.src=r.result;};r.readAsDataURL(file);}
function cropImage43(src,cb,mirror){const im=new Image();im.onload=()=>{const vw=im.naturalWidth||im.width,vh=im.naturalHeight||im.height;let sw=vw,shh=vw*3/4;if(shh>vh){shh=vh;sw=vh*4/3;}const cv=document.createElement('canvas');cv.width=480;cv.height=360;const g=cv.getContext('2d');if(mirror){g.translate(480,0);g.scale(-1,1);}g.drawImage(im,(vw-sw)/2,(vh-shh)/2,sw,shh,0,0,480,360);cb(cv.toDataURL('image/jpeg',.85));};im.src=src;}

/* ================= 큐알 그림 ================= */
function qrSVG(){let r='';let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!inF&&rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;}
  return `<svg viewBox="0 0 21 21" shape-rendering="crispEdges">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`;}

   const wrap=el('div','tab-wrap');const tab=el('div','tablet');const pwr=el('button','pwr hint');pwr.setAttribute('aria-label','전원 버튼');const scr=el('div','screen');tab.append(pwr,scr);

   const setZ=(nz,anim=true)=>{nz=Math.max(1,Math.min(4,nz));px=px*nz/z;py=py*nz/z;z=nz;apply(anim);if(st===5&&z>=2.5&&!said){said=true;c.say('크게 보이네요! 이제 우리 학교를 눌러요.');}};

     if(open===3){c.say('세 가지 질문을 모두 열었어요! 이 질문으로 광고를 살펴봐요.');qz.append(el('p','lead','광고 탐정 확인 문제'));quiz(qz,c,[{q:'광고는 물건을 더 (<span class="ini">ㅈㅇ</span>) 보이게 표현하기도 해요.',opts:['작아','좋아','지루해'],ans:1,why:'광고는 물건을 더 <b>좋아</b> 보이게 꾸미기도 해요. 그래서 두 번째 질문이 필요해요!',hintAll:'ㅈㅇ… 광고는 사고 싶게 만들어요.'}]);}};g.append(b);});
   a.append(g,qz);}},
 {say:'두 번째 질문! 어떻게 좋아 보이게 했을까? 과자 광고 속 마법을 하나씩 꺼 보면 진짜 모습이 보여요.',prop:'glass',render(a,c){

   const play=el('button','btn small ghost','▶ 광고 보기 (소리)');play.onclick=()=>sfx('jingle');
   const F=[['fx-music','🎵 신나는 음악'],['fx-color','🎨 눈에 띄는 색'],['fx-face','😄 즐거운 표정'],['fx-words','💬 멋진 말']];let off=0;
   const bs=el('div','fx-btns');F.forEach(([k,n])=>{const b=el('button','fx-btn',n+' 끄기');b.onclick=()=>{if(b.classList.contains('off'))return;b.classList.add('off');ad.classList.remove(k);off++;sfx('pop');
     c.say({'fx-music':'신나는 음악으로 기분을 좋게 만들었어요.','fx-color':'눈에 띄는 색으로 과자를 크고 맛있어 보이게 했어요.','fx-face':'즐거운 표정으로 맛있어 보이게 했어요.','fx-words':'멋진 말로 사고 싶게 만들었어요.'}[k]);
     if(off===4){ad.querySelector('.real').hidden=false;sfx('win');c.say('광고 속 모습과 진짜 모습은 다를 수 있어요!');c.done();}};bs.append(b);});
   const pr=el('div','q-next');pr.append(play);a.append(pr,ad,bs);}},
 {say:'세 번째 질문! 광고가 알려 주지 않은 것은 무엇일까? 장난감 광고에 숨은 작은 글씨 세 개를 찾아 눌러 보세요.',prop:'glass',render(a,c){

   const F=[['건전지는 따로 사야 해요','left:10px;bottom:10px'],['실제 크기는 손바닥만 해요','right:10px;bottom:10px'],['값: 25,000원','right:10px;top:56px']];let n=0;

     if(n===3){c.say('작은 글씨를 모두 찾았어요! 광고가 알려 주지 않은 것도 찾아봐야 해요.');c.done();}};ad.append(f);});

{id:'3-03',unit:3,icon:'🕵️',title:'나는 광고 탐정',goal:'세 가지 질문으로 광고를 살펴보고 영상 속 광고를 알아볼 수 있어요.',steps:[
 {say:'광고 탐정 수첩을 채워요! 광고 세 개를 보고 세 가지 질문에 답해 보세요.',prop:'glass',render(a,c){

    {name:'로봇 삐삐',bg:'linear-gradient(135deg,#4C7BEA,#9B6CF0)',hd:'말하는 로봇 친구 삐삐!',art:'🤖',model:'😆',tag:'🎁 지금 사면 스티커 선물!',tr:['gift','face','words','color'],sell:{o:['🤖 로봇 장난감','🎁 스티커','🔋 건전지'],a:0},hide:{o:['건전지를 따로 사야 한다는 것','로봇이라는 것','말을 한다는 것'],a:0,why:'건전지는 따로 사야 한대요. 광고에서는 말하지 않았어요.'}},
    {name:'번개 운동화',bg:'#E9EDF3',plain:true,hd:'번개 운동화를 신으면 나도 엄청 빨라져!',art:'👟⚡',model:'🏃',tag:'🌟 달리기 선수가 신는 운동화!',tr:['music','words','star'],sell:{o:['👟 운동화','🏃 달리기 대회','⚡ 번개'],a:0},hide:{o:['정말 빨라지는지는 알 수 없다는 것','운동화라는 것','발에 신는다는 것'],a:0,why:'운동화를 신는다고 엄청 빨라지지는 않아요. 광고는 그 점을 말하지 않았어요.'}}];
   let i=0,q=0;const notes=ADS.map(()=>({}));const box=el('div');a.append(box);
   const adHTML=ad=>`<div class="ad2${ad.plain?' plain':''}" style="background:${ad.bg}">${ad.tr.includes('music')?'<span class="ad2-notes">🎵🎶</span>':''}<div class="ad2-hd">${ad.hd}</div><div class="ad2-art">${ad.art}</div><div class="ad2-model">${ad.model}</div><div class="ad2-tag">${ad.tag}</div></div>`;
   const nextRow=()=>{const r=el('div','q-next');const b=el('button','btn small',q<2?'다음 질문 ▶':(i<ADS.length-1?'다음 광고 ▶':'📒 수첩 보기'));b.onclick=()=>{if(q<2)q++;else{q=0;i++;}if(i>=ADS.length)finish();else step();};r.append(b);box.append(r);};
   const step=()=>{const ad=ADS[i];box.innerHTML='';

     const fb=el('div','feedback');fb.hidden=true;

         else{sfx('bad');c.miss();shake(g);fb.className='feedback bad';fb.textContent=(miss?`아직 찾지 못한 것이 ${miss}개 있어요. `:'')+(extra?`광고에 없는 것을 ${extra}개 골랐어요.`:'')+' 광고를 다시 살펴봐요.';fb.hidden=false;wr++;if(wr>=2){speak(fb.textContent);thinkPause(g,fb);}else autoSpeak(fb.textContent);}};

{id:'3-05',unit:3,icon:'🎬',title:'왜 이 영상이 찾아왔을까요?',goal:'내가 본 것에 따라 다음에 보이는 것이 달라짐을 알아요.',steps:[
 {say:'영상 화면이에요. 보고 싶은 영상을 눌러 보세요. 화면이 어떻게 바뀌는지 잘 살펴봐요!',render(a,c){
   const C={animal:['동물',['🐶 강아지','🐱 고양이','🐰 토끼','🐼 판다','🐹 햄스터','🐧 펭귄']],soccer:['축구',['⚽ 멋진 골','🥅 골키퍼','👟 축구화','🏆 우승 경기']],dino:['공룡',['🦕 목 긴 공룡','🦖 티라노','🥚 공룡알']],cook:['요리',['🍳 계란 요리','🧁 컵케이크','🍕 피자 만들기']],car:['탈것',['🚗 자동차','🚒 소방차','🚂 기차']]};
   const keys=Object.keys(C);const cnt={};keys.forEach(k=>cnt[k]=0);let watched=0,busy=false;
   const pick=()=>{const w=keys.map(k=>1+4*cnt[k]);const tot=w.reduce((s,x)=>s+x,0);let r=Math.random()*tot;for(let i=0;i<keys.length;i++){r-=w[i];if(r<=0)return keys[i];}return keys[0];};
   const wrap=el('div','feed-wrap');const feed=el('div','feed');const memo=el('div','memo');const stop=el('button','btn stopbtn','■ 그만 보기');stop.hidden=true;
   const left=el('div');left.append(feed);const right=el('div');right.append(memo,stop);wrap.append(left,right);a.append(wrap);
   const drawMemo=()=>{const mx=Math.max(1,...keys.map(k=>cnt[k]));memo.innerHTML='<h3>🤖 기계의 기억</h3>'+keys.map(k=>`<div class="mrow"><span class="mn">${C[k][0]}</span><span class="mb" style="width:${cnt[k]/mx*100}%"></span><span>${cnt[k]}</span></div>`).join('')+`<div class="counter">본 영상 <b>${watched}</b>개</div>`;};
   const build=(first)=>{feed.innerHTML='';const used=new Set();
     const list=first?['animal','soccer','dino','cook','car','animal']:Array.from({length:6},pick);
     list.forEach(k=>{let t;const pool=C[k][1];for(let j=0;j<6;j++){t=pool[Math.floor(Math.random()*pool.length)];if(!used.has(t))break;}used.add(t);
       const [e,...rest]=t.split(' ');const v=el('button','vid c-'+k+(first?'':' flip'),`<span class="th">${e}</span><span class="vt">${rest.join(' ')}</span>`);
       v.onclick=()=>{if(busy)return;busy=true;v.classList.add('watching');sfx('pop');
         setTimeout(()=>{if(!c.alive())return;cnt[k]++;watched++;busy=false;drawMemo();build(false);
           const top=keys.reduce((m,x)=>cnt[x]>cnt[m]?x:m,keys[0]);
           if(watched>=3){stop.hidden=false;c.say(`${C[top][0]} 영상을 많이 봤더니 ${C[top][0]} 영상이 자꾸 나타나요! 볼지 말지는 내가 정해요. 그만 보기를 눌러 볼까요?`);}
           else c.say(`${C[k][0]} 영상을 봤어요. 화면이 바뀌었나요? 하나 더 골라 봐요.`);},800);};feed.append(v);});};
   stop.onclick=()=>{feed.innerHTML='<div class="lead" style="grid-column:1/-1;text-align:center;padding:30px 0">■ 영상을 껐어요. 잘했어요!</div>';stop.disabled=true;sfx('win');c.say('내가 본 것을 기계가 기억해서 비슷한 영상을 또 보여 줘요. 그래도 볼지 말지는 내가 선택해요!');c.done();};
   drawMemo();build(true);}},
 {say:'두 친구의 화면을 비교해 보아요.',render(a,c){

{id:'3-06',unit:3,icon:'🎛️',title:'내 화면은 내가 정해요',goal:'추천 영상을 내가 선택하고 조절할 수 있어요.',steps:[
 {say:'이번에는 내가 추천 기계가 되어 볼까요? 친구가 본 영상을 보고, 친구가 좋아할 영상 세 개를 골라 보내 주세요.',render(a,c){
   const POOL={dino:['🦕 공룡 화석 찾기','🦖 공룡 울음소리','🦴 공룡 뼈 맞추기'],cook:['🍪 쿠키 굽기','🍙 주먹밥 만들기','🥞 팬케이크 굽기'],car:['🚜 트랙터','✈️ 비행기','🚌 버스 여행'],animal:['🐶 강아지 산책','🐱 고양이 낮잠','🐼 판다 먹방'],soccer:['⚽ 멋진 골','🏆 우승 경기'],music:['🎹 피아노 연주','🥁 신나는 드럼']};
   const COL={dino:'c-dino',cook:'c-cook',car:'c-car',animal:'c-animal',soccer:'c-soccer',music:'c-animal'};
   const FR=[{n:'하늘이',e:'👧',hist:['🦕 목 긴 공룡','🦖 티라노','🥚 공룡알'],like:'dino'},{n:'바다',e:'👦',hist:['🍳 계란 요리','🧁 컵케이크','🍕 피자 만들기'],like:'cook'},{n:'별이',e:'🧒',hist:['🚒 소방차','🚂 기차','🚗 자동차'],like:'car'}];
   let i=0;const box=el('div');a.append(box);
   const show=()=>{box.innerHTML='';const f=FR[i];const others=Object.keys(POOL).filter(k=>k!==f.like);
     const cands=shuffle([...POOL[f.like].map(t=>[t,f.like]),...shuffle(others.flatMap(k=>POOL[k].map(t=>[t,k]))).slice(0,5)]);const sel=new Set();
     box.append(el('div','rec-head',`<span class="q-num">${i+1} / 3</span><span class="rec-who">${f.e} ${f.n}가 본 영상</span>`),el('div','mini-feed hist',f.hist.map(t=>`<span class="${COL[f.like]}">${t.split(' ')[0]}<small>${t.split(' ').slice(1).join(' ')}</small></span>`).join('')),el('p','lead',`${f.n}에게 보여 줄 영상 세 개를 골라요`));
     const grid=el('div','feed');const send=el('button','btn','📤 친구 화면에 보내기');send.disabled=true;const fb=el('div','feedback');fb.hidden=true;let wr=0;
     cands.forEach(([t,k])=>{const [e,...r]=t.split(' ');const v=el('button','vid '+COL[k],`<span class="th">${e}</span><span class="vt">${r.join(' ')}</span>`);v.onclick=()=>{if(sel.has(t)){sel.delete(t);v.classList.remove('picked');}else{if(sel.size>=3){shake(grid);c.say('세 개까지 고를 수 있어요.');return;}sel.add(t);v.classList.add('picked');}sfx('pop');send.disabled=sel.size!==3;};grid.append(v);});
     send.onclick=()=>{const hit=[...sel].filter(t=>POOL[f.like].includes(t)).length;
       if(hit===3){sfx('good');fb.className='feedback good';fb.innerHTML=`<b>😍 ${f.n}가 정말 좋아해요!</b> ${f.n}가 본 영상과 비슷한 영상을 골랐어요.`;fb.hidden=false;send.disabled=true;grid.classList.add('thinking');
         if(i<FR.length-1){const q=el('div','q-next');const nb=el('button','btn small','다음 친구 ▶');nb.onclick=()=>{i++;show();};q.append(nb);box.append(q);}else{c.done();c.say('추천 기계도 이렇게 내가 본 것을 기억해서 비슷한 영상을 골라 보여 줘요!');}}
       else{sfx('bad');c.miss();fb.className='feedback bad';fb.textContent=`🤔 ${f.n}가 좋아할 영상이 ${hit}개예요. ${f.n}가 본 영상을 다시 살펴보고 비슷한 것을 골라 봐요.`;fb.hidden=false;wr++;if(wr>=2){speak(fb.textContent);thinkPause(grid,fb);}else autoSpeak(fb.textContent);}};
     const q=el('div','q-next');q.append(send);box.append(grid,q,fb);};show();}},
 {say:'영상이 끝나면 다음 영상이 저절로 나와요. 숫자가 0이 되기 전에 자동 재생 스위치를 찾아 꺼 보세요!',render(a,c){
   const pl=el('div','vplayer');const scr=el('div','vp-scr');const sw=el('button','tgl');sw.setAttribute('aria-pressed','true');sw.setAttribute('aria-label','자동 재생');
   const bar=el('div','vp-bar');bar.append(el('span','vp-lb','자동 재생'),sw);pl.append(scr,bar);a.append(pl);
   let n=6,t=null,done=false;

     t=setInterval(()=>{if(!c.alive()){clearInterval(t);return;}n--;if(n<=0){clearInterval(t);scr.innerHTML='<div class="vp-next"><span>▶️</span><b>다음 영상이 시작됐어요!</b><em>다시 해 볼까요?</em></div>';sfx('bad');c.miss();c.say('앗, 다음 영상이 시작됐어요. 다시 해 봐요. 화면 아래 자동 재생 스위치를 찾아요!');setTimeout(()=>{if(c.alive()&&!done)loop();},1800);}else tick();},1000);};

   loop();}},
 {say:'내 화면은 내가 정할 수 있어요! 보기 싫은 영상은 관심 없음을 누르고, 보고 싶은 것은 검색해 보세요. 볼 시간도 정해요.',render(a,c){
   const ALL={scary:['😱 무서운 이야기','👻 깜짝 귀신'],candy:['🍬 사탕 많이 먹기','🍭 왕사탕 먹방'],game:['🎮 게임 광고','🕹️ 게임 아이템 뽑기'],animal:['🐶 강아지 산책','🐱 고양이 낮잠'],sci:['🔬 과학 실험','🌋 화산 만들기'],book:['📚 동화 읽기','🐻 곰 세 마리 동화'],art:['🎨 그림 그리기','✂️ 종이접기'],plant:['🌱 식물 키우기','🌻 해바라기 관찰']};
   const COL={scary:'c-dino',candy:'c-cook',game:'c-car',animal:'c-animal',sci:'c-dino',book:'c-cook',art:'c-car',plant:'c-soccer'};
   const SEARCH={'🔬 과학 실험':'sci','📚 동화':'book','🎨 그림 그리기':'art','🌱 식물 키우기':'plant','🐶 동물':'animal'};
   const blocked=new Set();let removed=0,searched=null,timer=null,doneSaid=false;let feed=['scary','candy','game','animal','scary','game'];
   const wrap=el('div','feed-wrap');const fe=el('div','feed');const side=el('div','memo');wrap.append(fe,side);
   const refill=()=>{const al=Object.keys(ALL).filter(k=>!blocked.has(k));feed=feed.map(k=>blocked.has(k)?(searched&&!blocked.has(searched)?searched:al[Math.floor(Math.random()*al.length)]):k);};
   const drawSide=()=>{side.innerHTML=`<h3>🧭 내가 정한 것</h3><ol class="checklist"><li class="${removed>=2?'ok':''}"><span class="ck">✓</span>관심 없음 두 번 누르기 (${Math.min(removed,2)}/2)</li><li class="${searched?'ok':''}"><span class="ck">✓</span>보고 싶은 것 검색하기</li><li class="${timer?'ok':''}"><span class="ck">✓</span>볼 시간 정하기</li></ol>${timer?`<div class="timer-badge">⏰ ${timer} 동안만 볼게요</div>`:''}`;
     if(removed>=2&&searched&&timer&&!doneSaid){doneSaid=true;c.done();c.say('관심 없음, 검색, 시간 정하기! 내 화면은 내가 정할 수 있어요.');}};
   const draw=()=>{fe.innerHTML='';feed.forEach((k,i)=>{const t=ALL[k][i%ALL[k].length];const [e,...r]=t.split(' ');const v=el('div','vid '+COL[k]+' flip',`<span class="th">${e}</span><span class="vt">${r.join(' ')}</span>`);
     const x=el('button','x','✕ 관심 없음');x.onclick=()=>{blocked.add(k);removed++;refill();sfx('pop');c.say(`'${r.join(' ')}' 같은 영상이 사라지고 다른 영상이 나왔어요!`);draw();drawSide();};v.append(x);fe.append(v);});};
   const sch=chips(Object.keys(SEARCH),(w,b,wr)=>{selectIn(wr,b);searched=SEARCH[w];blocked.delete(searched);feed=feed.map((k,i)=>i<4?searched:k);sfx('good');c.say(`'${w.split(' ').slice(1).join(' ')}' 영상을 찾았어요!`);draw();drawSide();});

]},

function show(id){stopCam();stopTune();$('#map').hidden=id!=='map';$('#stage').hidden=id!=='stage';$('#teacher').hidden=id!=='teacher';window.scrollTo(0,0);try{speechSynthesis.cancel();}catch(e){}}
const isUnlocked=i=>P.unlockAll||i===0||!!P.cleared[STAGES[i-1].id];
const XPOS=[50,76,50,24];

let MAPU=null;
function renderMap(){
  $('#head-mascot').innerHTML=mascot('star');drawMeChip();
  $('#gal-btn').hidden=!!((P.roster||[]).length&&!P.me);
  if((P.roster||[]).length&&!P.me){renderLogin();return;}
  const total=STAGES.reduce((s,st)=>s+(P.cleared[st.id]||0),0);$('#star-total').textContent=`⭐ ${total} / ${STAGES.length*3}`;
  const list=$('#map-list');list.innerHTML='';
  const curIdx=STAGES.findIndex((s,i)=>isUnlocked(i)&&!P.cleared[s.id]);
  if(MAPU==null){
    list.append(el('p','lead map-hint','단원을 골라 들어가요. 한 단원을 다 깨면 다음 단원이 열려요.'));
    const g=el('div','unit-grid');
    Object.keys(UNITS).map(Number).forEach(u=>{const idx=STAGES.map((s,i)=>[s,i]).filter(([s])=>s.unit===u);const lock=!isUnlocked(idx[0][1]);
      const done=idx.filter(([s])=>P.cleared[s.id]).length,stars=idx.reduce((n,[s])=>n+(P.cleared[s.id]||0),0),hasCur=idx.some(([,i])=>i===curIdx);
      const b=el('button','unit-card u'+u+(lock?' locked':'')+(hasCur?' current':''),`${hasCur?'<span class="here">지금 할 차례!</span>':''}<span class="no">${lock?'🔒':u}</span><span class="nm">${UNITS[u].name}</span><span class="sub">${UNITS[u].sub}</span><span class="prog"><i style="width:${done/idx.length*100}%"></i></span><span class="cnt">${done} / ${idx.length}차시 · ⭐ ${stars} / ${idx.length*3}</span>`);
      b.setAttribute('aria-label',`${u}단원 ${UNITS[u].name}${lock?' (잠김)':''}`);
      b.onclick=()=>{if(lock){sfx('bad');toast('앞 단원을 먼저 깨면 열려요!');return;}sfx('pop');MAPU=u;renderMap();window.scrollTo(0,0);};g.append(b);});
    list.append(g);requestAnimationFrame(drawPath);return;}
  const u=MAPU;const back=el('button','icon-btn unit-back','← 단원 고르기');back.onclick=()=>{MAPU=null;sfx('pop');renderMap();};
  list.append(back,el('div','unit-banner u'+u,`<span class="no">${u}</span><div><div class="nm">${UNITS[u].name}</div><div class="sub">${UNITS[u].sub}</div></div>`));
  let k=0;
  STAGES.forEach((st,i)=>{if(st.unit!==u)return;
    const row=el('div','node-row u'+st.unit);const lock=!isUnlocked(i);const stars=P.cleared[st.id]||0;
    const n=el('button','node'+(lock?' locked':'')+(stars?' done':'')+(i===curIdx?' current':''),
      `${i===curIdx?'<span class="here">지금 할 차례!</span>':''}<span class="disc"><span class="ic">${lock?'🔒':st.icon}</span><span class="cd">${st.id}</span></span><span class="lb">${st.title.split(' - ')[0]}</span><span class="stars">${'<b>★</b>'.repeat(stars)}${'★'.repeat(3-stars)}</span>`);
    n.style.left=XPOS[k%4]+'%';k++;n.setAttribute('aria-label',`${st.id} ${st.title}${lock?' (잠김)':''}`);
    n.onclick=()=>{if(lock){sfx('bad');toast('앞 스테이지를 먼저 깨면 열려요!');return;}sfx('pop');openStage(i);};
    row.append(n);list.append(row);});
  if(u<6){const nx=el('div','map-foot');const nb=el('button','btn small ghost',`다음 단원 ▶`);nb.onclick=()=>{const idx=STAGES.findIndex(s=>s.unit===u+1);if(!isUnlocked(idx)){sfx('bad');toast('이 단원을 다 깨면 다음 단원이 열려요!');return;}MAPU=u+1;sfx('pop');renderMap();window.scrollTo(0,0);};nx.append(nb);list.append(nx);}
  requestAnimationFrame(drawPath);
}
function drawPath(){const body=$('#map-body'),svg=$('#map-svg');if($('#map').hidden)return;const r=body.getBoundingClientRect();
  const pts=[...body.querySelectorAll('.node .disc')].map(d=>{const b=d.getBoundingClientRect();return [b.left-r.left+b.width/2,b.top-r.top+b.height/2];});
  if(pts.length<2){svg.innerHTML='';svg.removeAttribute('width');svg.removeAttribute('height');svg.removeAttribute('viewBox');return;}
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.setAttribute('width',r.width);svg.setAttribute('height',r.height);
  let d='';pts.forEach((p,i)=>{if(!i)d+=`M${p[0]},${p[1]}`;else{const q=pts[i-1],my=(q[1]+p[1])/2;d+=` C${q[0]},${my} ${p[0]},${my} ${p[0]},${p[1]}`;}});
  svg.innerHTML=`<path d="${d}" fill="none" style="stroke:#FFFFFF" stroke-width="18" stroke-linecap="round"/><path d="${d}" fill="none" style="stroke:#9DB7EC" stroke-width="6" stroke-dasharray="1 16" stroke-linecap="round"/>`;}
window.addEventListener('resize',()=>requestAnimationFrame(drawPath));
let toastT;function toast(t){let e=$('.lock-toast');if(!e){e=el('div','lock-toast');document.body.append(e);}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200);}

let cur=null,token=0;
function setSay(t,prop){$('#say').innerHTML=t;const sp=$('#spk');sp.classList.remove('new');if(!P.autoRead){void sp.offsetWidth;sp.classList.add('new');}if(prop!==undefined)$('#guide-mascot').innerHTML=mascot(prop);autoSpeak(t);}
function openStage(i,opt={}){$('#overlay').innerHTML='';const st=STAGES[i];cur={i,st,step:opt.step||0,miss:0,data:sharedData(st,!!opt.preview),preview:!!opt.preview};MAPU=st.unit;
  const sec=$('#stage');sec.className='u'+st.unit;$('#st-code').textContent=st.id;$('#st-title').textContent=st.title;$('#st-goal').textContent='학습목표: '+st.goal;
  $('#pv-tag').hidden=!cur.preview;$('#back-btn').textContent=cur.preview?'📋':'🗺️';$('#back-btn').setAttribute('aria-label',cur.preview?'전체 구성으로 돌아가기':'지도로 돌아가기');
  show('stage');renderStep();if(cur.step===0)showMission();}
function renderStep(){if(cur&&!cur.preview&&cur.st.share)save();const {st,step}=cur;const s=st.steps[step];const my=++token;stopCam();stopTune();try{speechSynthesis.cancel();}catch(e){}
  $('#st-dots').innerHTML=st.steps.map((_,i)=>`<i class="${i<step?'on':''}${i===step?' now':''}"></i>`).join('');
  $('#step-lbl').textContent=`활동 ${step+1} / ${st.steps.length}`;
  const nb=$('#next-btn');nb.disabled=true;nb.classList.remove('ready');nb.textContent=step===st.steps.length-1?(cur.preview?'미리 보기 끝 ✓':'스테이지 완료! ⭐'):'다음 활동 ▶';
  const area=$('#area');area.innerHTML='';window.scrollTo(0,0);
  setSay(s.say,s.prop||'');
  const ctx={data:cur.data,alive:()=>my===token,say:t=>{if(my===token)setSay(t);},miss:()=>{if(my===token&&!s.explore)cur.miss++;},done:()=>{if(my!==token||!nb.disabled)return;nb.disabled=false;nb.classList.add('ready');}};
  s.render(area,ctx);updateGuide();
  if(cur.preview)nb.disabled=false;}
$('#next-btn').onclick=()=>{if(!cur)return;if(!cur.preview){try{saveWork(cur.st,cur.step);}catch(e){}}if(cur.step<cur.st.steps.length-1){cur.step++;sfx('pop');renderStep();}else finishStage();};
$('#back-btn').onclick=()=>{const pv=cur&&cur.preview;cur=null;token++;stopCam();stopTune();if(pv)openTeacher();else{show('map');renderMap();}};
$('#spk').onclick=()=>{$('#spk').classList.remove('new');speak($('#say').textContent);};

function finishStage(){const {st,miss,i,preview}=cur;const last=i===STAGES.length-1;const ov=$('#overlay');ov.innerHTML='';
  if(preview){const bg=el('div','clear-bg u'+st.unit);const card=el('div','clear-card',`${mascot('')}<h2>${st.id} 미리 보기 끝</h2><div class="g">학생 별 기록은 바뀌지 않았어요.</div>`);
    const bt=el('div','clear-btns');const tb=el('button','btn ghost','📋 전체 구성으로');tb.onclick=()=>{ov.innerHTML='';cur=null;token++;openTeacher();};bt.append(tb);
    if(!last){const nx=el('button','btn','다음 차시 미리 보기 ▶');nx.onclick=()=>{ov.innerHTML='';openStage(i+1,{preview:true});};bt.append(nx);}
    card.append(bt);bg.append(card);ov.append(bg);return;}
  const stars=miss<=1?3:miss<=3?2:1;P.last=Date.now();if(st.share)save();P.cleared[st.id]=Math.max(P.cleared[st.id]||0,stars);save();sendRecord(st.id,P.cleared[st.id]);sfx('win');
  const bg=el('div','clear-bg u'+st.unit);const card=el('div','clear-card',`${mascot('star')}<h2>${st.id} 스테이지 클리어!</h2><div class="big-stars">${'<b>★</b>'.repeat(stars)}${'★'.repeat(3-stars)}</div><div class="g">이제 나는 <b>${st.goal}</b></div>${last?'<p class="lead">모든 스테이지를 깼어요! 이제 진짜 미디어 지킴이예요.</p>':''}`);
  const bt=el('div','clear-btns');const toMap=el('button','btn ghost','🗺️ 지도로');toMap.onclick=()=>{ov.innerHTML='';cur=null;token++;show('map');renderMap();};bt.append(toMap);
  if(!last){const nx=el('button','btn','다음 스테이지 ▶');nx.onclick=()=>{ov.innerHTML='';openStage(i+1);};bt.append(nx);}
  card.append(bt);bg.append(card);ov.append(bg);
  speak(`${st.id} 스테이지 클리어! 별 ${stars}개를 받았어요.`);}
