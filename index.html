  const ov=$('#overlay');ov.innerHTML='';const bg=el('div','sheet-bg');const sh=el('form','sheet gate');
  let x,y;const newQ=()=>{x=6+Math.floor(Math.random()*4);y=6+Math.floor(Math.random()*4);sh.querySelector('.q').textContent=`${x} × ${y} = ?`;};
  sh.innerHTML=`<h2>🍎 선생님 확인</h2><p class="note">선생님만 들어갈 수 있어요. 곱셈의 답을 입력해 주세요.</p><div class="q"></div><input id="gate-in" type="text" inputmode="numeric" autocomplete="off" aria-label="답"><div class="feedback bad" hidden>답이 달라요. 새 문제를 풀어 주세요.</div>`;
  const bt=el('div','clear-btns');bt.style.marginTop='14px';const cancel=el('button','btn ghost','닫기');cancel.onclick=()=>ov.innerHTML='';const ok=el('button','btn','들어가기');ok.type='submit';bt.append(cancel,ok);sh.append(bt);
  sh.onsubmit=e=>{e.preventDefault();const v=parseInt(sh.querySelector('input').value,10);if(v===x*y){teacherOK=true;ov.innerHTML='';openTeacher();}else{sh.querySelector('.feedback').hidden=false;shake(sh);sh.querySelector('input').value='';newQ();}};
  bg.onclick=e=>{if(e.target===bg)ov.innerHTML='';};bg.append(sh);ov.append(bg);newQ();setTimeout(()=>{try{sh.querySelector('input').focus();}catch(e){}},50);}

function renderVoicePanel(){const box=$('#t-voice');box.innerHTML='<h2>🔊 목소리 설정</h2><p class="note">이 태블릿에 설치된 한국어 목소리 중에서 고를 수 있어요.</p>';
  const vs=koVoices();
  if(!vs.length){box.append(el('div','feedback bad','이 기기에서 한국어 목소리를 찾지 못했어요. 기기 설정의 "텍스트 음성 변환"에서 한국어 음성을 내려받은 뒤 다시 열어 주세요.'));}
  else{box.append(el('label',null,'목소리'));const sel=el('select');sel.id='voice-sel';
    const auto=el('option',null,'자동으로 가장 자연스러운 목소리 고르기');auto.value='';sel.append(auto);
    vs.slice().sort((a,b)=>rankVoice(a)-rankVoice(b)).forEach(v=>{const o=el('option',null,v.name+(rankVoice(v)<=1?' ★ 자연스러움':''));o.value=v.name;sel.append(o);});
    sel.value=P.voice||'';sel.onchange=()=>{P.voice=sel.value;save();speak('안녕! 나는 음표 친구야.');};box.append(sel);}
  box.append(el('label',null,'말투'));const pg=el('div','preset-grid');
  Object.entries(PRESETS).forEach(([k,v])=>{const b=el('button','preset'+(P.preset===k?' sel':''),`${v.n}<small>${v.d}</small>`);b.onclick=()=>{P.preset=k;save();selectIn(pg,b);speak('안녕! 나는 음표 친구야. 오늘도 미디어 탐험을 떠나 볼까?');};pg.append(b);});box.append(pg);
  const row=el('div','v-row');const t=el('button','btn small','▶ 들어 보기');t.onclick=()=>speak('안녕! 나는 음표 친구야. 우리 집에 숨어 있는 미디어를 모두 찾아 눌러 볼까?');row.append(t);box.append(row);
  box.append(el('div','tip','목소리는 기기마다 달라요. 이름에 <b>Natural·Online·향상됨·Premium</b>이 붙은 목소리가 가장 자연스러워요. 아이패드는 설정 › 손쉬운 사용 › 읽기 및 말하기에서 <b>유나(향상됨)</b>를 내려받으면 훨씬 부드러워져요. 크롬북·크롬에서는 <b>Google 한국의</b> 목소리를 골라 보세요.'));}

function renderSetPanel(){const box=$('#t-set');box.innerHTML='<h2>⚙️ 수업 설정</h2><p class="note">기록은 이 태블릿 브라우저에만 저장되고, 이름이나 개인정보는 받지 않아요.</p>';
  const row=(t,d,on,fn)=>{const r=el('div','set-row',`<div><div class="t">${t}</div><div class="d">${d}</div></div>`);const b=el('button','tgl');b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',t);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);fn(v);save();};r.append(b);box.append(r);};
  const act=(t,d,label,fn)=>{const r=el('div','set-row',`<div><div class="t">${t}</div><div class="d">${d}</div></div>`);const b=el('button','btn small danger',label);let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='한 번 더 누르면 지워져요';return;}fn();save();b.textContent='지웠어요';b.disabled=true;};r.append(b);box.append(r);};
  const sr=el('div','set-row','<div style="flex:1"><div class="t">우리 학교 이름</div><div class="d">1-05 디지털 지도와 네이버 지도 찾기에 쓰여요.</div></div>');const si=document.createElement('input');si.className='t-in';si.id='school-in';si.placeholder='예: 행복초등학교';si.value=P.school||'';si.maxLength=20;si.oninput=()=>{P.school=si.value.trim();save();};sr.querySelector('div').append(si);box.append(sr);
  row('자동으로 읽어 주기','꺼 두면 학생이 🔊 버튼을 눌러야 읽어 줘요. 태블릿 여러 대를 함께 쓸 때는 꺼 두세요.',P.autoRead,v=>P.autoRead=v);
  row('학생 화면 스테이지 모두 열기','차시 순서를 바꿔 운영할 때 켜요.',P.unlockAll,v=>P.unlockAll=v);
  act('모든 학생 기록 지우기','명단은 그대로 두고 모든 학생의 별, 미디어 지도, 정리 응답, 만들던 광고·캠페인을 지워요.','지우기',()=>{Object.keys(P.students||{}).forEach(id=>{P.students[id]={};});P.cleared={};P.map=null;P.map2=null;P.day=null;P.day2=null;P.promise=null;P.share=null;P.wrap=null;P.works=[];P.rubric=null;P.tgrade={};renderUnits();});
  act('2-01 칭찬 기차 비우기',`지금 ${Array.isArray(P.train)?P.train.length:0}칸이 이어져 있어요.`,'비우기',()=>{P.train=[];});
  act('2-04 생각 구름 비우기',`지금 낱말 ${Array.isArray(P.cloud)?P.cloud.length:CLOUD_SEED.length}개가 모여 있어요. 비우면 예시 낱말만 남아요.`,'비우기',()=>{P.cloud=null;});}
function renderPhotoPanel(){const box=$('#t-photo');if(!box)return;box.innerHTML='<h2>🖼️ 3-01 사진 바꾸기</h2><p class="note">지금은 예시 그림이 들어 있어요. AI로 만든 사진이나 직접 고른 사진을 칸마다 넣을 수 있어요. 넣은 사진은 이 기기에만 저장돼요.</p>';
  const g=el('div','t-photo-grid');
  FAKE_PAIRS.forEach((p,i)=>{const card=el('div','t-ph',`<b>${i+1}번 · ${p.title}</b>`);const pair=el('div','pair');
    [[p.real,'진짜 사진'],[p.fake,'꾸민 사진']].forEach(([k,lab])=>{const col=el('div');col.innerHTML=photoHTML(k);const lb=el('label','up');lb.append(document.createTextNode(lab+' 바꾸기'));
      const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.id='ph-'+k;fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;shrinkImage(f,640,480,url=>{PH[k]=url;if(!savePhotos()){delete PH[k];toast('저장 공간이 부족해요. 더 작은 사진을 넣어 주세요.');}renderPhotoPanel();});};lb.append(fi);col.append(lb);
      if(PH[k]){const rb=el('button','btn small ghost','예시 그림으로');rb.onclick=()=>{delete PH[k];savePhotos();renderPhotoPanel();};col.append(rb);}pair.append(col);});
    card.append(pair);g.append(card);});box.append(g);}

function renderUnits(){const wrap=$('#t-units');wrap.innerHTML='';wrap.append(el('p','t-sum',`전체 ${STAGES.length}차시 · 차시마다 약 40분 (도입 5분 · 활동 30분 · 정리 5분) · 카드마다 수업 안내를 펼쳐 볼 수 있어요.`));
  Object.keys(UNITS).map(Number).forEach(u=>{const sec=el('section','t-unit u'+u);sec.append(el('div','t-unit-h',`<span class="no">${u}</span><div><h2>${UNITS[u].name}</h2><div class="tc-g">${UNITS[u].sub}</div></div>`));
    const cards=el('div','t-cards');
    STAGES.forEach((st,i)=>{if(st.unit!==u)return;const stars=P.cleared[st.id]||0;
      const c=el('article','t-card',`<div class="tc-h"><span class="tc-id">${st.icon} ${st.id}</span><h3>${st.title}</h3></div><div class="tc-g">학습목표: ${st.goal}</div>`);
      const mm=stageMins(st);const mt=META[st.id]||{};const cu=CUR[st.id];if(cu)c.append(el('div','tc-cur',`<span><b>🧭 중심 역량</b> ${esc(cu[0])}</span><span><b>📘 성취기준·연계</b> ${esc(cu[1])}</span>`));const ol=el('ol');st.steps.forEach((s,k)=>{const li=el('li',null,`<span>${esc(stepName(st,k,true))}</span>`);li.append(el('em','pv-min',mm.steps[k]+'분'));const b=el('button','pv','미리 보기');b.onclick=()=>openStage(i,{preview:true,step:k});li.append(b);ol.append(li);});c.append(ol);
      c.append(el('details','tc-guide',`<summary>📋 수업 안내 (시간 · 발문 · 정리 활동)</summary><div class="tg-row"><b>⏰ 예상 시간 약 ${mm.total}분</b>도입 5분 (미션 카드 · 도입 발문) + 활동 ${mm.act}분 + 정리 5분</div>${mt.ask?`<div class="tg-row"><b>🗣️ 교사 발문</b><ul><li><i>도입</i>${esc(mt.ask[0])}</li><li><i>전개</i>${esc(mt.ask[1])}</li><li><i>정리</i>${esc(mt.ask[2])}</li></ul></div>`:''}<div class="tg-row"><b>🧩 정리 활동</b>학생 화면의 '오늘의 정리'에서 목표 달성을 스스로 점검하고 배운 것을 한 줄로 남긴 뒤, 정리 발문으로 짝과 이야기해요. 끝에 다음 스테이지를 예고해요.</div>`));
      const f=el('div','tc-f',`<span>이 기기 학생 기록: ${stars?'<b>'+'★'.repeat(stars)+'</b>'+'☆'.repeat(3-stars):'아직 안 함'}</span>`);const all=el('button','btn small','처음부터 ▶');all.onclick=()=>openStage(i,{preview:true});f.append(all);c.append(f);
      cards.append(c);});
    sec.append(cards);wrap.append(sec);});}

function openTeacher(){show('teacher');renderVoicePanel();renderSetPanel();renderClassPanel();renderPhotoPanel();renderUnits();
  $('#t-std').innerHTML=`<b>📘 관련 성취기준 (개발안 기준)</b><br>${Object.entries(STD).map(([k,v])=>`${k} ${v}`).join('<br>')}<p class="note">차시 카드마다 중심 역량과 관련 성취기준·연계를 적었어요. 학교 계획서에 맞게 확인해 주세요. 탐색 활동(1-01 미디어 찾기, 1-05 태블릿 체험, 3-04 반짝 버튼 찾기, 3-06 자동 재생)은 틀려도 별이 깎이지 않아요.</p>`;
  setTTab(TTAB);}
document.querySelectorAll('#t-tabs .tab').forEach(b=>b.onclick=()=>{setTTab(b.dataset.t);sfx('pop');});
$('#teacher-btn').onclick=teacherGate;
$('#gal-btn').onclick=myGallery;
$('#me-chip').onclick=()=>{switchStudent(null);sfx('pop');MAPU=null;renderMap();};
$('#t-back').onclick=()=>{show('map');renderMap();};

try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(!$('#teacher').hidden)renderVoicePanel();};}catch(e){}
normRoster();readClassLink();flushOutbox();
renderMap();
</script>
